# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Automated review settings.
#
# Pull requests target `develop`, which is not the default branch, and auto
# review is limited to the default branch unless the bases are listed here.
# Without this every pull request in the normal workflow would go unreviewed.
reviews:
  auto_review:
    enabled: true
    base_branches:
      - develop

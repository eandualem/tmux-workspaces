[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmux-workspaces"
version = "0.1.0"
description = "A workspace layer for tmux"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
tmux-workspaces = "tmux_workspaces.bootstrap:main"

[tool.setuptools.packages.find]
include = ["tmux_workspaces*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "RUF012"]

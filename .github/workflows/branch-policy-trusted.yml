name: Branch policy (trusted)

# pull_request_target runs this workflow and the validator from the base branch,
# so a pull request cannot edit either one to pass its own routing check.
# Never check out or run the pull request's code here.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  target:
    name: PR target (trusted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate integration and promotion routes
        run: python3 scripts/check_pr_target.py

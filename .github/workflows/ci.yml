name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux terminal tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux locales
          sudo locale-gen en_US.UTF-8
      - name: Install macOS terminal tools
        if: runner.os == 'macOS'
        run: brew list tmux || brew install tmux
      - name: Install lint tool
        run: python -m pip install ruff==0.16.6
      - name: Record environment
        run: |
          python --version
          tmux -V
          python -m ruff --version
      - name: Lint, formatting and unit tests
        run: make check PYTHON=python RUFF="python -m ruff"
      - name: Real terminal integration tests
        run: make smoke PYTHON=python
